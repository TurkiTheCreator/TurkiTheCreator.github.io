<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ · Turki Hufais</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--card:#111114;--line:#1f1f24;--text:#e8e8ec;--muted:#9a9aa3;--accent:#ff2e63;--green:#9fef00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.75;font-size:16px}
  .top{position:sticky;top:0;background:#000e;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
  .top div{max-width:860px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
  .top a{color:#fff;text-decoration:none;font-weight:600}
  .top a span{color:var(--accent)}
  .top .back{font-weight:500;font-size:.9rem;color:var(--muted)}
  .top .back:hover{color:var(--accent)}
  main{max-width:860px;margin:0 auto;padding:40px 24px 80px}
  h1{font-size:2.2rem;line-height:1.2;margin:10px 0 20px}
  h2{font-size:1.45rem;margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  h2::before{content:"# ";color:var(--accent)}
  h3{font-size:1.1rem;margin:30px 0 10px;color:#fff}
  a{color:var(--accent)}
  p,li{color:#cfcfd6}
  strong{color:#fff}
  code{font-family:"JetBrains Mono",monospace;font-size:.86em;background:#16161b;padding:2px 6px;border-radius:4px;color:var(--green)}
  pre{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:16px 18px;overflow-x:auto;line-height:1.55}
  pre code{background:none;padding:0;color:#e6e6e6;font-size:.84rem}
  table{border-collapse:collapse;width:100%;margin:18px 0;font-size:.92rem}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left}
  th{background:var(--card);color:#fff}
  blockquote{margin:18px 0;padding:10px 18px;border-left:3px solid var(--accent);background:#ff2e630d;color:#ddd}
  hr{border:0;border-top:1px solid var(--line);margin:40px 0}
  img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
  footer{text-align:center;color:var(--muted);font-size:.82rem;padding:24px;border-top:1px solid var(--line)}
  /* pandoc syntax highlighting */
  $highlighting-css$
</style>
</head>
<body>
<header class="top"><div>
  <a href="../index.html">Turki<span>.</span></a>
  <a class="back" href="../index.html#writeups">← All write-ups</a>
</div></header>
<main>
$body$
</main>
<footer>© Turki Hufais · 0xgyro</footer>
</body>
</html>
